name: Dinext acceptance
on:
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: scoring-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cypress:
    name: Cypress acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pci" --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      CI: 'true'
      DINEXT_DEPLOY_ENABLED: 'false'
      DINEXT_NOTIFICATIONS_ENABLED: 'false'
      DINEXT_DOCS_AGENT_ENABLED: '0'
      DINEXT_WIKI_PUBLISH_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext-common
          ref: afbbe97eee7a3f4ed1a151d6d07e6cf441c9d7d2
          path: ci-support
          persist-credentials: false
          sparse-checkout: .github/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client libmariadb-dev libmariadb-dev-compat libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev redis-tools xvfb xauth libgtk-3-0t64 libgbm1 libnss3 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libnotify4
          python -m pip install frappe-bench==5.31.0
          npm install --global yarn@1.22.22
      - name: Build disposable bench and run all server tests
        run: python ci-support/.github/ci/bench_tests.py "$GITHUB_WORKSPACE"
      - name: Run report regression, JavaScript suites and browser acceptance
        run: python .github/ci/scoring_acceptance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: project-scoring-acceptance
          path: |
            ${{ runner.temp }}/*-unit.xml
            ${{ runner.temp }}/scoring-acceptance/
          if-no-files-found: error
          retention-days: 14
